[[asset]]
path = "moon_terms.bin"
source = "Meeus Astronomical Algorithms tables 47.A/47.B, via astronomia's MIT-licensed transcription"
source_url = "https://github.com/commenthol/astronomia/blob/master/src/moonposition.js"
license = "MIT (notice reproduced in THIRD_PARTY_NOTICES.md)"
model = "60 longitude/radius terms and 60 latitude terms"
max_horizons_topocentric_position_error_arcsec = 14.10
sha256 = "4242e9c3d0c2f30d7f7864555160e88ec3cb01d0ffb6333bd945706dcae5d685"

[[asset]]
path = "bright_stars.bin"
source = "Yale Bright Star Catalogue, 5th Revised Edition (Hoffleit & Warren 1991), CDS V/50/catalog"
source_url = "https://cdsarc.cds.unistra.fr/viz-bin/cat/V/50"
license = "public-domain astronomical catalog data"
model = "9,096 valid FK5/J2000 epoch-2000 records; RA, Dec, Johnson V, and B-V; no proper motion"
nominal_limiting_magnitude = 6.5
sha256 = "72e4ac8502ac0ce21b3c1f2f679ea3f8e08f17a443240dd944984c87064d2ba8"

[[asset]]
path = "moon_albedo.bin"
source = "NASA Scientific Visualization Studio CGI Moon Kit 2025 color map, LRO WAC/LOLA"
source_url = "https://svs.gsfc.nasa.gov/4720/"
license = "NASA public data; credit NASA Scientific Visualization Studio"
model = "128x64 8-bit luminance, Lanczos downsampled from lroc_color_2k.jpg for display texturing"
sha256 = "1cff7fd23c1af7fc1ecb3c26cdc7b110d16b74e20f876eda4218ddf7f7e6fe6c"
