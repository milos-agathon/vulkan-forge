format_version = 1
validity = "2000-01-01 through 2050-12-31 UTC"
# Required upstream copyright/permission notices for everything redistributed
# from this directory (moon_terms.bin is MIT and needs its notice shipped).
third_party_notices = "THIRD_PARTY_NOTICES.md"

[[asset]]
path = "delta_t_fit.dat"
source = "JPL Horizons DE441 observer table quantity 49 (IERS EOP eop.260804.p261031), monthly nodes"
source_url = "https://ssd.jpl.nasa.gov/horizons/"
license = "NASA/JPL public ephemeris data"
model = "piecewise-linear TT-UT1 fit; future EOP follows Horizons' declared frozen-EOP assumption"
max_validated_midmonth_residual_seconds = 0.0066
sha256 = "d570a9b05388a19a39f0d2c74d62572ac3db913567676823be239aff37c2f347"

[[asset]]
path = "leap_seconds.dat"
source = "IERS Bulletin C leap-second history through Bulletin C 52"
source_url = "https://hpiers.obspm.fr/iers/bul/bulc/bulletinc.dat"
license = "IERS public data"
model = "TAI-UTC offsets; the last published offset is held constant through 2050"
sha256 = "04c99602d83e104a56b55a3a184425804676eab83bc731238b989be560e0e336"

[[asset]]
path = "vsop87d.bin"
source = "IMCCE VSOP87D heliocentric ecliptic theory, bounded truncation for Earth and Mercury through Saturn"
source_url = "https://ftp.imcce.fr/pub/ephem/planets/vsop87/"
license = "IMCCE public astronomical theory data"
model = "14,793 retained of 25,659 VSOP87D terms; smallest bounded contributions omitted per body/coordinate over abs(t) <= 0.051"
truncation_max_abs_t = 0.051
max_omitted_longitude_radians_per_body = 5.0e-8
max_omitted_latitude_radians_per_body = 5.0e-8
max_omitted_radius_au_per_body = 2.0e-8
max_horizons_position_error_arcsec = 3.0
sha256 = "5f5cc2b1661861269bb4ed00a5b562587ed5912915584040411871b51f6ffb95"

[asset.term_counts.mercury]
longitude = [986, 174, 10, 2, 1, 1]
latitude = [517, 55, 8, 1, 1, 1]
radius = [746, 106, 8, 1, 1, 1]

[asset.term_counts.venus]
longitude = [342, 39, 3, 1, 1, 1]
latitude = [167, 21, 3, 1, 1, 1]
radius = [299, 27, 2, 1, 1, 1]

[asset.term_counts.earth]
longitude = [540, 73, 3, 1, 1, 1]
latitude = [140, 4, 1, 1, 1]
radius = [519, 58, 2, 1, 1, 1]

[asset.term_counts.mars]
