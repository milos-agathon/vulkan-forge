[asset.term_counts.jupiter]
longitude = [760, 181, 38, 4, 1, 1]
latitude = [232, 52, 6, 1, 1, 1]
radius = [745, 333, 57, 6, 1, 1]

[asset.term_counts.saturn]
longitude = [1152, 366, 50, 8, 1, 1]
