# ./pytest.ini
# Central PyTest configuration for Forge3D test suite.
# Provides shared markers and discovery paths for consistent CI runs.
# RELEVANT FILES:tests/conftest.py,pytest.ini,docs/conf.py,pyproject.toml
[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    opbr: Workstream B PBR-focused tests.
    olighting: Workstream B lighting-focused tests.
    geometry: Workstream F geometry-focused tests.
    io: Workstream F IO-focused tests.
    viewer: Viewer-dependent tests requiring display/GPU resources.
    interactive_viewer: Interactive viewer E2E tests (requires display/GPU). Opt-in via RUN_INTERACTIVE_VIEWER_CI=1.
    offscreen: Offscreen GPU rendering tests requiring a usable graphics adapter.
    recipe_golden: Pixel golden requiring an explicit authoritative physical/dedicated lane.
    anamnesis_physical: ANAMNESIS tests requiring the authoritative physical-GPU lane.
    sidera_vulkan: SIDERA committed-reference tests requiring NVIDIA Vulkan.
    cross_backend: Tests requiring two physical graphics backends.
    nvidia_vulkan: Tests requiring the authoritative NVIDIA Vulkan lane.
    limes_physical: LIMES throughput test requiring the authoritative physical-GPU lane.
    helios_physical: HELIOS test requiring the authoritative physical-GPU lane.
    gpu_lane: TESSELLA tests requiring the authoritative physical-GPU lane.
    f3dz_physical: F3DZ tests requiring the authoritative physical NVIDIA GPU lane.
    apple_metal_physical: Hardware-backed tests owned by the required Apple Metal acceptance lane.
    apple_metal_contract: Ordered/repeated Apple Metal contract nodes excluded from the semantic family sweep.
    apple_metal_proxy: Duplicate compatibility proxy excluded from authoritative Apple Metal selection.
    slow: Full-scale deterministic stress and mutation gates.
