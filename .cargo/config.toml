[alias]
# Canonical routine Rust lint gate used by local hooks and pull-request CI.
# Keep this to the extension/default architectural surface; exhaustive feature
# linting is an explicit acceptance concern below.
forge3d-clippy = "clippy --workspace --all-targets --features extension-module,default,cog_streaming,shader-contract-asserts -- -D warnings"

# Explicit acceptance/release lint gate. This mirrors the supported portable
# feature matrix without requiring system-PROJ from `--all-features`.
forge3d-clippy-acceptance = "clippy --workspace --all-targets --features extension-module,default,async_readback,copc_laz,cog_streaming,gis-remote,geos-topology,weighted-oit,wsI_bigbuf,wsI_double_buf,enable-pbr,enable-tbn,enable-normal-mapping,enable-hdr-offscreen,enable-renderer-config,enable-staging-rings,shader-contract-asserts,atmosphere-bake -- -D warnings"
