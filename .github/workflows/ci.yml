  # ============================================================================
  # Rust Tests (cargo test)
  # ============================================================================
  test-rust:
    name: Test Rust (${{ matrix.os }})
    needs: preflight
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libproj-dev libsqlite3-dev sqlite3 pkg-config

      - name: Run cargo check
        run: cargo check --workspace --features default,async_readback,copc_laz,cog_streaming,gis-remote,geos-topology,weighted-oit,wsI_bigbuf,wsI_double_buf,enable-pbr,enable-tbn,enable-normal-mapping,enable-hdr-offscreen,enable-renderer-config,enable-staging-rings,shader-contract-asserts

      - name: Run cargo check (system PROJ feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --workspace --features proj

      - name: Run cargo test (skip GPU-dependent tests)
        run: cargo test --workspace --features default,async_readback,copc_laz,cog_streaming,gis-remote,geos-topology,weighted-oit,wsI_bigbuf,wsI_double_buf,enable-pbr,enable-tbn,enable-normal-mapping,enable-hdr-offscreen,enable-renderer-config,enable-staging-rings,shader-contract-asserts -- --test-threads=1 --skip gpu_extrusion --skip brdf_tile
        env:
          RUST_TEST_THREADS: 1

      - name: Run AETHER offline-bake acceptance tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --features atmosphere-bake core::atmosphere -- --test-threads=1
        env:
          RUST_TEST_THREADS: 1

      - name: Run doctests (proves the MENSURA compile_fail contracts)
        # Executes rustdoc examples, including the five `compile_fail` proofs in
        # src/geo/units.rs that make unit/height/CRS/epoch mismatches and the raw
        # f64->f32 world-coordinate narrowing genuinely fail to compile.
        run: cargo test --doc --workspace --features default,async_readback,copc_laz,cog_streaming,gis-remote,geos-topology,weighted-oit,wsI_bigbuf,wsI_double_buf,enable-pbr,enable-tbn,enable-normal-mapping,enable-hdr-offscreen,enable-renderer-config,enable-staging-rings,shader-contract-asserts

      - name: Run cargo clippy
        run: cargo forge3d-clippy-acceptance

  # ============================================================================
  # Interactive Viewer E2E (macOS only; optional)
  #
  # INFORMATIONAL ONLY: this job is `continue-on-error: true` on its test step
  # and is deliberately NOT in `PR Core Success` needs. Its result never gates the
  # build. The interactive lane's test files are accounted for by the
  # `interactive_viewer` marker in the UNRUN/(e)-gate bookkeeping, not here.
  # ============================================================================
  test-interactive-viewer-macos:
    name: Interactive Viewer (macOS)
    needs: build-wheel-macos
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download macOS wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: dist/

      - name: Install wheel and pytest
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install pytest pyyaml numpy

      - name: Run interactive viewer tests
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
          RUN_INTERACTIVE_VIEWER_CI: '1'
        run: |
          pytest tests/ -m interactive_viewer -v --tb=short
        continue-on-error: true

  # ============================================================================
  # Exact-head platform wheels. Each named job is independently consumable, so
  # a Linux consumer never waits for Windows, macOS, or aarch64.
  # ============================================================================
  build-wheel-windows:
    name: Build Wheel (Windows)
    needs: preflight
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      maturin_args: --release --out dist
      manylinux: 'auto'
      artifact: wheels-windows

  build-wheel-linux:
    name: Build Wheel (Linux)
    needs: preflight
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'core' || inputs.scope == 'full' || inputs.scope == 'determinism' ||
        inputs.scope == 'f3dz' || inputs.scope == 'anamnesis'))
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: ubuntu-latest
      target: x86_64-unknown-linux-gnu
      maturin_args: --release --out dist -i python3.10
      manylinux: 'off'
      artifact: wheels-linux

  build-wheel-macos:
    name: Build Wheel (macOS)
    needs: preflight
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'core' || inputs.scope == 'full' || inputs.scope == 'determinism'))
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: macos-latest
      target: universal2-apple-darwin
      maturin_args: --release --out dist
      manylinux: 'auto'
      artifact: wheels-macos

  build-wheel-linux-arm:
    name: Build Wheel (Linux aarch64)
    needs: preflight
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: ubuntu-latest
      target: aarch64-unknown-linux-gnu
      maturin_args: --release --out dist -i python3.10
      manylinux: 'auto'
      artifact: wheels-linux-arm

  # ============================================================================
  # Python acceptance tests. Routine PRs use test-fast-contract above; manual
  # core selects hosted compatibility, while the exhaustive matrix is nightly
  # or explicit full.
  # ============================================================================
  test-python-core:
    name: Python Core (Linux 3.11 full)
    needs: [build-wheel-linux, prepare-lfs-fixtures]
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'core'
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: ubuntu-latest
      python_versions: '["3.11"]'
      wheel_artifact: wheels-linux
      test_mode: full
      restore_lfs: true

  test-python-compat-linux:
    name: Python Compatibility (Linux boundaries)
    needs: build-wheel-linux
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'core'
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: ubuntu-latest
      python_versions: '["3.10", "3.13"]'
      wheel_artifact: wheels-linux
      test_mode: compatibility

  test-python-compat-windows:
    name: Python Compatibility (Windows)
    needs: build-wheel-windows
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'core'
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: windows-latest
      python_versions: '["3.11"]'
      wheel_artifact: wheels-windows
      test_mode: compatibility

  test-python-compat-macos:
    name: Python Compatibility (macOS)
    needs: build-wheel-macos
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'core'
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: macos-latest
      python_versions: '["3.11"]'
      wheel_artifact: wheels-macos
      test_mode: compatibility

  test-python-full-linux:
    name: Python Full Matrix (Linux)
    needs: [build-wheel-linux, prepare-lfs-fixtures]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: ubuntu-latest
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      wheel_artifact: wheels-linux
      test_mode: full
      restore_lfs: true

  test-python-full-windows:
    name: Python Full Matrix (Windows)
    needs: [build-wheel-windows, prepare-lfs-fixtures]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: windows-latest
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      wheel_artifact: wheels-windows
      test_mode: full
      restore_lfs: true

  test-python-full-macos:
    name: Python Full Matrix (macOS)
    needs: [build-wheel-macos, prepare-lfs-fixtures]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    uses: ./.github/workflows/test-python-wheel.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      runner: macos-latest
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      wheel_artifact: wheels-macos
      test_mode: full
      restore_lfs: true

  # ============================================================================
  # Accounted slow Python tests (one hosted representative)
  # ============================================================================
  test-python-slow:
    name: Test Python Slow (ubuntu, 3.11)
    needs: [build-wheel-linux, prepare-lfs-fixtures]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download shared LFS fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: lfs-fixture-bundles
          path: lfs-fixture-bundles

      - name: Restore Python TIFF fixtures
        run: python -m zipfile -e lfs-fixture-bundles/python-tiffs.zip .

      - name: Download Linux wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux
          path: dist/

      - name: Install wheel and slow-lane dependencies
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install pytest pyyaml numpy pillow

      - name: Run accounted slow Python lane
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: python scripts/ci_pytest_lane.py --profile full --slow-lane -v --tb=short

  # ============================================================================
  # TERMINUS deterministic CPU-only robustness fuzzer
  #
  # The command performs exactly two fixed-seed passes internally and fails on
  # process death, timeout, property mismatch, or digest drift. It exercises
  # only CPU-safe public APIs and never requests a GPU adapter.
  # ============================================================================
  test-terminus-fuzz:
    name: TERMINUS 10k Deterministic Fuzzer (CPU)
    needs: build-wheel-linux
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux
          path: dist/

      - name: Install wheel and fuzzer dependencies
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install numpy

      - name: Run two deterministic 10k passes
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: |
          set -o pipefail
          mkdir -p target/terminus-fuzz-evidence
          python -m tests._fuzz \
            --cases 10000 \
            --seed 42 \
            --tmp-dir target/terminus-fuzz \
            --summary-json target/terminus-fuzz-evidence/terminus-fuzz-summary.json \
            --summary-markdown target/terminus-fuzz-evidence/terminus-fuzz-summary.md \
            2>&1 | tee target/terminus-fuzz-evidence/terminus-fuzz.log
          cat target/terminus-fuzz-evidence/terminus-fuzz-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TERMINUS fuzzer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminus-fuzzer-evidence
          path: target/terminus-fuzz-evidence/
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Linux aarch64 Wheel Smoke Test (QEMU)
  # ============================================================================
  test-python-linux-arm:
    name: Install Smoke (linux-arm)
    needs: build-wheel-linux-arm
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download linux-arm wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-arm
          path: dist/

      - name: Run smoke test in arm64 container
        shell: bash
        run: |
          docker run --rm --platform linux/arm64/v8 \
            -v "${PWD}:/workspace" \
            -w /workspace \
            python:3.11-slim \
            bash -lc "python -m pip install -U pip pytest numpy && python /workspace/scripts/install_compatible_wheel.py /workspace/dist && FORGE3D_NO_BOOTSTRAP=1 pytest tests/test_install_smoke.py -v --tb=short"

  # ============================================================================
  # Visual Golden Image Tests
  # ============================================================================
  # Optional backend diagnostic retained for macOS support. It is disabled by
  # default and is never consumed by Full Acceptance Summary.
  test-golden-images:
    name: Visual Goldens (optional Metal diagnostic)
    continue-on-error: true
    needs: [build-wheel-macos, terrain-golden-paths]
    runs-on: macos-14
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) &&
       vars.FORGE3D_RUN_METAL_DIAGNOSTIC == '1'
    outputs:
      aether_lane: ${{ steps.aether-absent.outputs.aether_lane || steps.aether-ran.outputs.aether_lane || steps.aether-software-absent.outputs.aether_lane || 'unknown' }}
    env:
      WGPU_BACKEND: metal
      FORGE3D_ALLOW_HOSTED_MACOS_TERRAIN: '1'
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_SUBSTRATIA_GOLDEN_VARIANT: metal
      FORGE3D_RUN_TERRAIN_GOLDENS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: dist/
      - name: Install optional diagnostic dependencies
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install pytest numpy pillow
      - name: Probe optional Metal backend
        id: metal-probe
        shell: bash
        run: |
          set +e
          python scripts/terrain_ci_probe.py --mode terrain
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "probe=positive" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            mkdir -p metal-diagnostic-out
            echo "optional Metal diagnostic ABSENT" > metal-diagnostic-out/goldens.ABSENT
            echo "probe=absent" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Run optional Metal terrain control
        if: steps.metal-probe.outputs.probe == 'positive'
        run: python -m pytest tests/test_terrain_visual_goldens.py -v --tb=short
      - name: Probe AETHER physical Metal closure backend
        if: ${{ !cancelled() }}
        id: aether-metal-probe
        shell: bash
        run: |
          set +e
          python scripts/terrain_ci_probe.py --mode aether-metal --json tests/artifacts/aether/adapter-probe.json
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "probe=positive" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            echo "probe=absent" >> "$GITHUB_OUTPUT"
          else
            echo "::error::AETHER physical Metal probe crashed (exit $code)"
            exit "$code"
          fi
      - name: Verify exact AETHER wheel custom-bake provenance
        if: ${{ !cancelled() && steps.aether-metal-probe.outputs.probe == 'positive' }}
        id: aether_custom_bake
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: python -c 'from forge3d._native import get_native_module; h=get_native_module().atmosphere_bake_luts(ozone_du=321.0, mie_g=0.71, ground_albedo=0.42, scattering_orders=2); assert h.precomputed is False'
      - name: Run AETHER Metal closure and golden gates
        if: ${{ !cancelled() && steps.aether-metal-probe.outputs.probe == 'positive' && steps.aether_custom_bake.outcome == 'success' }}
        id: aether-ran
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
          FORGE3D_AETHER_PHYSICAL_METAL: '1'
          FORGE3D_AETHER_METRICS_PATH: tests/artifacts/aether/metrics.json
        run: |
          mkdir -p tests/artifacts/aether
          git rev-parse HEAD > tests/artifacts/aether/checked-out-head.txt
          junit=tests/artifacts/aether/junit.xml
          python -m pytest \
            tests/test_atmosphere_spectral.py \
            tests/test_atmosphere_reference.py \
            tests/test_atmosphere_pt_reference.py \
            tests/test_atmosphere_golden.py \
            tests/test_atmosphere_lut_handoff.py \
            -v --tb=short --junitxml="$junit"
          python scripts/assert_junit_zero_skips.py "$junit"
          python scripts/aether_acceptance_evidence.py tests/artifacts/aether \
            --head-sha '${{ github.sha }}' \
            --repository '${{ github.repository }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --job '${{ github.job }}'
          echo "aether_lane=ran" >> "$GITHUB_OUTPUT"
      - name: Upload AETHER physical Metal evidence
        if: always() && steps.aether-metal-probe.outputs.probe == 'positive'
        uses: actions/upload-artifact@v4
        with:
          name: aether-physical-metal-evidence
          path: tests/artifacts/aether/
          if-no-files-found: error
          retention-days: 90
      - name: Record AETHER Metal lane ABSENT
        if: ${{ !cancelled() && steps.aether-metal-probe.outputs.probe == 'absent' }}
        id: aether-absent
        shell: bash
        run: |
          mkdir -p aether-out
          echo "AETHER closure lane ABSENT: no proven physical Metal adapter" > aether-out/aether.ABSENT
          echo "aether_lane=absent" >> "$GITHUB_OUTPUT"
      - name: Record AETHER Metal lane ABSENT under software override
        if: ${{ !cancelled() && env.FORGE3D_ALLOW_SOFTWARE_GOLDENS == '1' }}
        id: aether-software-absent
        shell: bash
        run: |
          mkdir -p aether-out
          echo "AETHER closure lane ABSENT: software execution does not prove physical Metal" > aether-out/aether.ABSENT
          echo "aether_lane=absent" >> "$GITHUB_OUTPUT"
      - name: Upload AETHER Metal lane marker
        if: always() && (steps.aether-absent.outcome == 'success' || steps.aether-software-absent.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: aether-metal-lane-marker
          path: aether-out/
          if-no-files-found: error
          retention-days: 7
      - name: Upload optional Metal absence marker
        if: steps.metal-probe.outputs.probe == 'absent'
        uses: actions/upload-artifact@v4
        with:
          name: golden-lane-marker
          path: metal-diagnostic-out/
          if-no-files-found: error
          retention-days: 7
      - name: Upload optional Metal diagnostic diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-golden-diffs
          path: tests/artifacts/
          retention-days: 7

  test-golden-images-nvidia:
    name: Visual Goldens (NVIDIA Vulkan)
    # Candidate acceptance proves physical pixels without exposing production
    # signing material to branch code. Signed certificate rotation remains the
    # protected main-only responsibility of certificate-refresh.yml.
    needs: [build-wheel-windows, terrain-golden-paths]
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    # Full Acceptance consumes explicit RAN outputs in addition to job success.
    outputs:
      lane: ${{ steps.golden-pass.outputs.golden_lane || 'unknown' }}
      sidera_lane: ${{ steps.sidera-pass.outputs.sidera_lane || 'unknown' }}
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_ALLOW_HOSTED_WINDOWS_TERRAIN: '1'
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_DETERMINISM_TEST_BACKEND: vulkan
      FORGE3D_TERRAIN_GOLDEN_VARIANT: nvidia-vulkan
      FORGE3D_RECIPE_GOLDEN_VARIANT: nvidia-vulkan
      FORGE3D_SUBSTRATIA_GOLDEN_VARIANT: nvidia-vulkan
      FORGE3D_SUBSTRATIA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize isolated visual evidence directory
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "forge3d-visual-${{ github.run_id }}-${{ github.run_attempt }}"
          "FORGE3D_VISUAL_ARTIFACT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_TERRAIN_GOLDEN_ARTIFACT_DIR=$(Join-Path $root 'terrain-goldens')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_RECIPE_GOLDEN_ARTIFACT_DIR=$(Join-Path $root 'recipe-goldens')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_SUBSTRATIA_ARTIFACT_DIR=$(Join-Path $root 'substratia')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_SIDERA_ARTIFACT_DIR=$(Join-Path $root 'sidera')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_EXPECTED_ADAPTER_PROBE=$(Join-Path $root 'adapter-probe.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/

      - name: Install wheel and test dependencies
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest numpy pyproj pillow
          exit $LASTEXITCODE

      - name: Bind lane to exact clean candidate
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:FORGE3D_SUBSTRATIA_CANDIDATE_SHA) { throw "candidate SHA mismatch" }
          $dirty = (git status --porcelain --untracked-files=no | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "candidate tracked worktree is dirty: $dirty" }
          if ($env:FORGE3D_SUBSTRATIA_CANDIDATE_SHA.Length -ne 40) { throw "candidate SHA is not full length" }
          New-Item -ItemType Directory -Force -Path $env:FORGE3D_VISUAL_ARTIFACT_DIR | Out-Null

      - name: Require physical NVIDIA Vulkan terrain adapter
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_EXPECTED_ADAPTER_PROBE"
          exit $LASTEXITCODE

      - name: Run visual golden tests
        shell: pwsh
        env:
          FORGE3D_RUN_TERRAIN_GOLDENS: '1'
          FORGE3D_UPDATE_RECIPE_CERTIFICATES: '0'
        run: |
          $junit = Join-Path $env:FORGE3D_VISUAL_ARTIFACT_DIR "visual-junit.xml"
          python scripts/run_nvidia_visual_acceptance.py --suite visual --junit "$junit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/assert_junit_zero_skips.py "$junit"
          exit $LASTEXITCODE

      - name: Run SIDERA NVIDIA Vulkan night golden
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:FORGE3D_SIDERA_ARTIFACT_DIR | Out-Null
          $junit = Join-Path $env:FORGE3D_SIDERA_ARTIFACT_DIR "junit.xml"
          python -m pytest tests/test_astro_night_golden.py -v --tb=short --junitxml="$junit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/assert_junit_zero_skips.py "$junit"
          exit $LASTEXITCODE

      - name: Record visual golden lane RAN
        id: golden-pass
        shell: pwsh
        run: '"golden_lane=ran" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'

      - name: Record SIDERA lane RAN
        id: sidera-pass
        shell: pwsh
        run: '"sidera_lane=ran" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append'

      - name: Upload SHA- and adapter-bound visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-gpu-evidence
          path: ${{ runner.temp }}/forge3d-visual-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

      - name: Clean visual evidence scratch
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "forge3d-visual-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }

  # Optional Metal support diagnostic. It remains available for explicit
  # backend investigation but is not an acceptance dependency.
  test-substratia-gpu:
    name: SUBSTRATIA Physical GPU (optional Metal diagnostic)
    continue-on-error: true
    needs: [build-wheel-macos, terrain-golden-paths]
    if: >-
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) &&
      vars.FORGE3D_RUN_METAL_DIAGNOSTIC == '1'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      WGPU_BACKEND: metal
      FORGE3D_ALLOW_HOSTED_MACOS_TERRAIN: '1'
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_SUBSTRATIA_GOLDEN_VARIANT: metal
      FORGE3D_SUBSTRATIA_ARTIFACT_DIR: tests/artifacts/substratia-metal-diagnostic
      FORGE3D_SUBSTRATIA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORGE3D_EXPECTED_ADAPTER_PROBE: tests/artifacts/substratia-metal-diagnostic/adapter-probe.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: dist/
      - name: Install optional diagnostic dependencies
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install pytest numpy pillow
      - name: Bind optional diagnostic to exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORGE3D_SUBSTRATIA_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$FORGE3D_SUBSTRATIA_ARTIFACT_DIR"
      - name: Validate physical Metal adapter when diagnostic is enabled
        shell: bash
        run: python scripts/terrain_ci_probe.py --mode terrain --json "$FORGE3D_EXPECTED_ADAPTER_PROBE"
      - name: Run optional Metal SUBSTRATIA controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_terrain_vt_pbr_families.py::TestTerrainVTPbrFamilies::test_normal_family_changes_lighting_ssim \
            tests/test_terrain_vt_pbr_families.py::TestTerrainVTPbrFamilies::test_all_families_page_within_budget \
            tests/test_terrain_vt_pbr_families.py::TestTerrainVTPbrFamilies::test_missing_family_is_fatal \
            tests/test_terrain_vt_pbr_families.py::TestTerrainVTPbrFamilies::test_partial_normal_residency_degrades_gracefully \
            --junitxml="$FORGE3D_SUBSTRATIA_ARTIFACT_DIR/pytest-junit.xml" -v --tb=short
          python scripts/assert_junit_zero_skips.py "$FORGE3D_SUBSTRATIA_ARTIFACT_DIR/pytest-junit.xml"
          python scripts/substratia_evidence_report.py \
            --artifact-dir "$FORGE3D_SUBSTRATIA_ARTIFACT_DIR" \
            --repository . \
            --candidate-sha "$FORGE3D_SUBSTRATIA_CANDIDATE_SHA" \
            --adapter-probe "$FORGE3D_EXPECTED_ADAPTER_PROBE" \
            --render-adapter "$FORGE3D_SUBSTRATIA_ARTIFACT_DIR/render-process-adapter.json" \
            --junit "$FORGE3D_SUBSTRATIA_ARTIFACT_DIR/pytest-junit.xml" \
            --expected-backend metal
      - name: Upload optional Metal SUBSTRATIA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substratia-metal-diagnostic-evidence
          path: tests/artifacts/substratia-metal-diagnostic/
          if-no-files-found: error
          retention-days: 90

  # SUBSTRATIA's claims require physical pixels. This is deliberately separate
  # from PR Core Success and has no software/ABSENT success path: a selected
  # full-acceptance run must execute the four core tests on a physical NVIDIA Vulkan GPU,
  # then pass the independent exact-SHA evidence verifier.
  test-substratia-gpu-nvidia:
    name: SUBSTRATIA Physical GPU (NVIDIA Vulkan)
    needs: [build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 30
    outputs:
      lane: ${{ steps.substratia-pass.outputs.lane || 'unknown' }}
      verifier: ${{ steps.substratia-pass.outputs.verifier || 'unknown' }}
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_ALLOW_HOSTED_WINDOWS_TERRAIN: '1'
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_SUBSTRATIA_GOLDEN_VARIANT: nvidia-vulkan
      FORGE3D_SUBSTRATIA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Initialize isolated SUBSTRATIA evidence directory
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "forge3d-substratia-${{ github.run_id }}-${{ github.run_attempt }}"
          "FORGE3D_SUBSTRATIA_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FORGE3D_EXPECTED_ADAPTER_PROBE=$(Join-Path $artifactDir 'adapter-probe.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact-candidate Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/

      - name: Install wheel and evidence dependencies
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest numpy pillow
          exit $LASTEXITCODE

      - name: Bind lane to exact clean candidate
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:FORGE3D_SUBSTRATIA_CANDIDATE_SHA) { throw "candidate SHA mismatch" }
          $dirty = (git status --porcelain --untracked-files=no | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "candidate tracked worktree is dirty: $dirty" }
          if ($env:FORGE3D_SUBSTRATIA_CANDIDATE_SHA.Length -ne 40) { throw "candidate SHA is not full length" }
          New-Item -ItemType Directory -Force -Path $env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR | Out-Null

      - name: Require physical NVIDIA Vulkan terrain adapter
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_EXPECTED_ADAPTER_PROBE"
          exit $LASTEXITCODE

      - name: Run exact SUBSTRATIA core acceptance tests
        shell: pwsh
        run: |
          $junit = Join-Path $env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR "pytest-junit.xml"
          python scripts/run_nvidia_visual_acceptance.py --suite substratia --junit "$junit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/assert_junit_zero_skips.py "$junit"
          exit $LASTEXITCODE

      - name: Independently verify SUBSTRATIA evidence
        shell: pwsh
        run: |
          python scripts/substratia_evidence_report.py --artifact-dir "$env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR" --repository . --candidate-sha "$env:FORGE3D_SUBSTRATIA_CANDIDATE_SHA" --adapter-probe "$env:FORGE3D_EXPECTED_ADAPTER_PROBE" --render-adapter "$env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR/render-process-adapter.json" --junit "$env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR/pytest-junit.xml" --expected-backend vulkan
          exit $LASTEXITCODE

      - name: Record physical lane RAN and verifier PASS
        id: substratia-pass
        shell: pwsh
        run: |
          $lane = Get-Content (Join-Path $env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR "lane-ran.json") -Raw | ConvertFrom-Json
          $verification = Get-Content (Join-Path $env:FORGE3D_SUBSTRATIA_ARTIFACT_DIR "verification.json") -Raw | ConvertFrom-Json
          if ($lane.status -ne "RAN" -or $verification.status -ne "PASS") { throw "SUBSTRATIA evidence did not record RAN/PASS" }
          "lane=ran" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verifier=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload SHA- and adapter-bound SUBSTRATIA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substratia-nvidia-physical-gpu-evidence
          path: ${{ runner.temp }}/forge3d-substratia-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

      - name: Clean SUBSTRATIA evidence scratch
        if: always()
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "forge3d-substratia-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }

  # ============================================================================
  # M-06 Option-2 Full Geospatial Viewer acceptance
  #
  # This lane is required and zero-skip only on nightly runs or explicit manual
  # M-06/full dispatches. An unavailable adapter, a stale/missing release viewer,
  # or a skipped acceptance test is a hard error whenever the lane is selected.
  # ============================================================================
  test-m06-full-geospatial-viewer:
    name: M-06 Full Geospatial Viewer (NVIDIA Vulkan)
    needs: [build-wheel-windows, prepare-lfs-fixtures, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'm06'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 35
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      RUN_M06_VIEWER_CI: '1'
      RUN_LIMES_GPU_CI: '1'
      FORGE3D_TEST_DEM: ${{ github.workspace }}/assets/tif/switzerland_dem.tif

    steps:
      - name: Initialize persistent M-06 evidence before checkout
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "forge3d-m06-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "FORGE3D_M06_ARTIFACT_DIR=$artifactDir" | Add-Content $env:GITHUB_ENV
          $env:FORGE3D_M06_ARTIFACT_DIR = $artifactDir
          New-Item -ItemType Directory -Force $env:FORGE3D_M06_ARTIFACT_DIR | Out-Null
          $scratchDrive = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $null -ne $_.Free -and $_.Root } |
            Sort-Object Free -Descending |
            Select-Object -First 1
          if ($null -eq $scratchDrive) { throw 'No filesystem drive is available for M-06 scratch data' }
          $scratchScope = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $scratchDir = Join-Path $scratchDrive.Root "forge3d-ci-scratch/$scratchScope"
          $targetDir = Join-Path $scratchDir 'cargo-target'
          $viewerBinary = Join-Path $targetDir 'release/interactive_viewer.exe'
          New-Item -ItemType Directory -Force $targetDir | Out-Null
          "FORGE3D_M06_SCRATCH_DIR=$scratchDir" | Add-Content $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$targetDir" | Add-Content $env:GITHUB_ENV
          "FORGE3D_VIEWER_BINARY=$viewerBinary" | Add-Content $env:GITHUB_ENV
          $env:FORGE3D_M06_SCRATCH_DIR = $scratchDir
          $env:CARGO_TARGET_DIR = $targetDir
          $env:FORGE3D_VIEWER_BINARY = $viewerBinary
          "initialized=$(Get-Date -Format o)" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/sentinel.txt"
          @{
            repository = $env:GITHUB_REPOSITORY
            base_sha = $env:BASE_SHA
            head_sha = $env:HEAD_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            job = $env:GITHUB_JOB
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            required_labels = @('self-hosted', 'Windows', 'X64', 'forge3d-gpu', 'gpu-nvidia')
            required_backend = 'vulkan'
            installed_wheel_required = $true
            scratch_dir = $scratchDir
          } | ConvertTo-Json -Depth 4 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/run-context.json"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download shared LFS fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: lfs-fixture-bundles
          path: lfs-fixture-bundles

      - name: Restore the M-06 DEM only
        shell: pwsh
        run: Expand-Archive lfs-fixture-bundles/m06-dem.zip -DestinationPath . -Force

      - name: Capture checkout and LFS provenance
        if: always()
        shell: pwsh
        run: |
          try { git rev-parse HEAD | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/checked-out-head.txt" } catch { $_ | Out-String | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/checkout-error.txt" }
          try { git lfs env 2>&1 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/git-lfs-env.txt" } catch { $_ | Out-String | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/git-lfs-error.txt" }
          try { git lfs ls-files --long 2>&1 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/git-lfs-files.txt" } catch { $_ | Out-String | Add-Content "$env:FORGE3D_M06_ARTIFACT_DIR/git-lfs-error.txt" }

      - name: Select stable Rust toolchain
        shell: pwsh
        run: |
          rustup default stable
          rustup show active-toolchain | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/rust-toolchain.txt"

      - name: Use runner-provisioned Python
        shell: pwsh
        run: |
          python --version 2>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/python-bootstrap-version.txt"
          python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/

      - name: Install wheel and acceptance dependencies
        shell: pwsh
        run: |
          python --version 2>&1 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/python-version.txt"
          rustc -Vv 2>&1 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/rustc-version.txt"
          cargo -Vv 2>&1 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/cargo-version.txt"
          Get-ChildItem dist -Filter *.whl | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256 | Format-List | Out-String
          } | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/wheel-sha256.txt"
          python scripts/install_compatible_wheel.py dist *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/wheel-install.log"
          $wheelCode = $LASTEXITCODE
          python -m pip install pytest numpy scipy pillow rasterio laspy pyproj pooch *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/dependency-install.log"
          $dependencyCode = $LASTEXITCODE
          "wheel_install=$wheelCode`ndependencies=$dependencyCode" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/install-exit-codes.txt"
          python -m pip freeze | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/python-dependencies.txt"
          python -c "import hashlib, json, pathlib, forge3d, forge3d._forge3d as native; p=pathlib.Path(native.__file__).resolve(); print(json.dumps({'package': str(pathlib.Path(forge3d.__file__).resolve()), 'native_extension': str(p), 'native_sha256': hashlib.sha256(p.read_bytes()).hexdigest()}, indent=2))" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/installed-wheel-runtime.json"
          if ($wheelCode -ne 0) { exit $wheelCode }
          if ($dependencyCode -ne 0) { exit $dependencyCode }

      - name: Build the exact release viewer under test
        shell: pwsh
        run: |
          $command = 'cargo build --release --bin interactive_viewer --features async_readback,enable-gpu-instancing'
          $command | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/build-command.txt"
          cargo build --release --bin interactive_viewer --features async_readback,enable-gpu-instancing *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/build.log"
          $code = $LASTEXITCODE
          "build=$code" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/build-exit-code.txt"
          if (Test-Path $env:FORGE3D_VIEWER_BINARY) {
            Get-FileHash $env:FORGE3D_VIEWER_BINARY -Algorithm SHA256 | Format-List | Out-String | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/viewer-sha256.txt"
          }
          exit $code

      - name: Require the exact NVIDIA Vulkan adapter
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_M06_ARTIFACT_DIR/adapter-probe.json" *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/adapter-probe.log"
          $code = $LASTEXITCODE
          "adapter_probe=$code" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/adapter-probe-exit-code.txt"
          exit $code

      - name: Run M-06 source and live acceptance
        shell: pwsh
        run: |
          $hdriDir = Join-Path $env:GITHUB_WORKSPACE 'assets/hdri'
          New-Item -ItemType Directory -Force $hdriDir | Out-Null
          python -c "from pathlib import Path; from tests.test_terrain_viewer_pbr import write_asymmetric_test_hdr; write_asymmetric_test_hdr(Path('assets/hdri/brown_photostudio_02_4k.hdr'))"
          $tests = @(
            'tests/test_shadow_techniques.py::TestEvsmExposureParity::test_evsm_is_not_black',
            'tests/test_shadow_techniques.py::TestEvsmExposureParity::test_evsm_banding_is_bounded_in_raw_visibility',
            'tests/test_picking_ipc.py',
            'tests/test_m06_full_geospatial_viewer.py',
            'tests/test_terrain_viewer_pbr.py',
            'tests/test_vector_overlay_rendering.py',
            'tests/test_vector_coverage.py'
          )
          $tests -join "`n" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/pytest-files.txt"
          $started = Get-Date
          python -m pytest @tests -v --tb=short --junitxml="$env:FORGE3D_M06_ARTIFACT_DIR/junit.xml" *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/pytest.log"
          $pytestCode = $LASTEXITCODE
          $finished = Get-Date
          @{
            started = $started.ToString('o')
            finished = $finished.ToString('o')
            elapsed_seconds = ($finished - $started).TotalSeconds
          } | ConvertTo-Json | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/test-timing.json"
          $verifyCode = 99
          if (Test-Path "$env:FORGE3D_M06_ARTIFACT_DIR/junit.xml") {
            python scripts/assert_junit_zero_skips.py "$env:FORGE3D_M06_ARTIFACT_DIR/junit.xml" *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/junit-verifier.log"
            $verifyCode = $LASTEXITCODE
          } else {
            'JUnit was not produced' | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/junit-verifier.log"
          }
          "pytest=$pytestCode`njunit_verifier=$verifyCode" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/test-exit-codes.txt"
          if ($pytestCode -ne 0) { exit $pytestCode }
          if ($verifyCode -ne 0) { exit $verifyCode }

      - name: Summarize public M-06 evidence
        if: always()
        shell: pwsh
        run: |
          python scripts/summarize_m06_evidence.py "$env:FORGE3D_M06_ARTIFACT_DIR" *>&1 | Tee-Object "$env:FORGE3D_M06_ARTIFACT_DIR/public-evidence-summary.log"
          $summaryCode = $LASTEXITCODE
          "public_summary=$summaryCode" | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/public-evidence-summary-exit-code.txt"
          if (Test-Path "$env:FORGE3D_M06_ARTIFACT_DIR/m06-public-evidence-summary.md") {
            Get-Content "$env:FORGE3D_M06_ARTIFACT_DIR/m06-public-evidence-summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $summaryCode

      - name: Finalize evidence manifest
        if: always()
        shell: pwsh
        run: |
          @{
            finalized = (Get-Date -Format o)
            github_sha = $env:GITHUB_SHA
            backend = $env:WGPU_BACKEND
            files = @(Get-ChildItem $env:FORGE3D_M06_ARTIFACT_DIR -Recurse -File | ForEach-Object {
              @{ path = $_.FullName.Substring($env:FORGE3D_M06_ARTIFACT_DIR.Length + 1); bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            })
          } | ConvertTo-Json -Depth 5 | Set-Content "$env:FORGE3D_M06_ARTIFACT_DIR/evidence-manifest.json"

      - name: Upload M-06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m06-full-geospatial-viewer-evidence
          path: ${{ runner.temp }}/forge3d-m06-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
      - name: Clean M-06 build scratch
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FORGE3D_M06_SCRATCH_DIR)) {
            Write-Warning 'M-06 scratch was not initialized; there is no scoped path to clean'
            exit 0
          }
          $scratchDir = [IO.Path]::GetFullPath($env:FORGE3D_M06_SCRATCH_DIR)
          $expectedLeaf = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $parentDir = Split-Path -Parent $scratchDir
          if ((Split-Path -Leaf $scratchDir) -ne $expectedLeaf -or
              (Split-Path -Leaf $parentDir) -ne 'forge3d-ci-scratch') {
            throw "Refusing to clean unexpected M-06 scratch path: $scratchDir"
          }
          if (Test-Path -LiteralPath $scratchDir) {
            Remove-Item -LiteralPath $scratchDir -Recurse -Force
          }

  # ============================================================================
  # COMPENDIUM F3DZ physical-GPU acceptance
  #
  # This is a required, zero-skip NVIDIA Vulkan lane whenever codec surfaces
  # change. The pytest gate proves every corpus page is byte-identical between
  # CPU and GPU decode. The benchmark records hardware throughput without
  # asserting a machine-dependent number in CI.
  # ============================================================================
  test-f3dz-gpu:
    name: F3DZ Codec (NVIDIA Vulkan)
    needs: [build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'f3dz'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_REQUIRE_F3DZ_GPU: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize exact-head evidence
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "forge3d-f3dz-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "FORGE3D_F3DZ_ARTIFACT_DIR=$artifactDir" | Add-Content $env:GITHUB_ENV
          $env:FORGE3D_F3DZ_ARTIFACT_DIR = $artifactDir
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $scratchDrive = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $null -ne $_.Free -and $_.Root } |
            Sort-Object Free -Descending |
            Select-Object -First 1
          if ($null -eq $scratchDrive) { throw 'No filesystem drive is available for F3DZ scratch data' }
          $scratchScope = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $scratchDir = Join-Path $scratchDrive.Root "forge3d-ci-scratch/$scratchScope"
          $targetDir = Join-Path $scratchDir 'cargo-target'
          New-Item -ItemType Directory -Force $targetDir | Out-Null
          "FORGE3D_F3DZ_SCRATCH_DIR=$scratchDir" | Add-Content $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$targetDir" | Add-Content $env:GITHUB_ENV
          $env:FORGE3D_F3DZ_SCRATCH_DIR = $scratchDir
          $env:CARGO_TARGET_DIR = $targetDir
          git rev-parse HEAD | Set-Content "$artifactDir/checked-out-head.txt"
          @{
            repository = $env:GITHUB_REPOSITORY
            github_sha = $env:GITHUB_SHA
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            required_backend = 'vulkan'
            required_labels = @('self-hosted', 'Windows', 'X64', 'forge3d-gpu', 'gpu-nvidia')
            scratch_dir = $scratchDir
          } | ConvertTo-Json -Depth 4 | Set-Content "$artifactDir/run-context.json"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install exact-head wheel and test dependencies
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/wheel-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest numpy *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/dependency-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all F3DZ corpus and CPU-GPU identity gates
        shell: pwsh
        run: |
          python -m pytest tests/test_f3dz_codec.py -v --tb=short --junitxml="$env:FORGE3D_F3DZ_ARTIFACT_DIR/junit.xml" *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/pytest.log"
          $pytestCode = $LASTEXITCODE
          python scripts/assert_junit_zero_skips.py "$env:FORGE3D_F3DZ_ARTIFACT_DIR/junit.xml" *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/junit-verifier.log"
          $verifyCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          exit $verifyCode
      - name: Select stable Rust toolchain for source benchmark
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/rust-toolchain.txt"
          exit $LASTEXITCODE
      - name: Record separate source benchmark (nightly/full only)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
        shell: pwsh
        run: |
          @{
            evidence_scope = 'source-benchmark-not-installed-wheel-acceptance'
            head_sha = (git rev-parse HEAD).Trim()
            rustc = (rustc -Vv | Out-String).Trim()
            cargo = (cargo -Vv | Out-String).Trim()
          } | ConvertTo-Json -Depth 3 | Set-Content "$env:FORGE3D_F3DZ_ARTIFACT_DIR/benchmark-provenance.json"
          cargo bench --bench f3dz_bench *>&1 | Tee-Object "$env:FORGE3D_F3DZ_ARTIFACT_DIR/benchmark.log"
          exit $LASTEXITCODE
      - name: Upload F3DZ physical-GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3dz-physical-gpu-evidence
          path: ${{ runner.temp }}/forge3d-f3dz-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
      - name: Clean F3DZ build scratch
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FORGE3D_F3DZ_SCRATCH_DIR)) {
            Write-Warning 'F3DZ scratch was not initialized; there is no scoped path to clean'
            exit 0
          }
          $scratchDir = [IO.Path]::GetFullPath($env:FORGE3D_F3DZ_SCRATCH_DIR)
          $expectedLeaf = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $parentDir = Split-Path -Parent $scratchDir
          if ((Split-Path -Leaf $scratchDir) -ne $expectedLeaf -or
              (Split-Path -Leaf $parentDir) -ne 'forge3d-ci-scratch') {
            throw "Refusing to clean unexpected F3DZ scratch path: $scratchDir"
          }
          if (Test-Path -LiteralPath $scratchDir) {
            Remove-Item -LiteralPath $scratchDir -Recurse -Force
          }

  # ============================================================================
  # ANAMNESIS physical cross-backend portability
  #
  # The protected NVIDIA runner seeds through Vulkan, then restores the same
  # native graph through DX12 in a separate job and clean workspace.
  # ============================================================================
  test-anamnesis-portability-seed:
    name: ANAMNESIS Physical Seed (Windows Vulkan)
    needs: [build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'anamnesis'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 20
    env:
      FORGE3D_DETERMINISTIC: '1'
      WGPU_BACKEND: vulkan
      WGPU_BACKENDS: vulkan
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_ANAMNESIS_COMPATIBILITY_PROFILE: terra-determinata-native-portable-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact-head checkout
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "ANAMNESIS checkout mismatch: expected=$expected actual=$actual"
          }
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install exact-head wheel
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install numpy pillow
      - name: Require physical NVIDIA Vulkan producer
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "anamnesis-portability-producer-adapter.json"
      - name: Record immutable producer machine identity
        shell: pwsh
        run: |
          $identity = (Get-CimInstance Win32_ComputerSystemProduct).UUID.Trim().ToLowerInvariant()
          if (-not $identity -or $identity -eq '00000000-0000-0000-0000-000000000000') {
            throw "ANAMNESIS producer machine identity is absent"
          }
          $identity | Set-Content "anamnesis-portability-producer-machine-id.txt"
      - name: Render TERRA golden and seed native terrain graph
        shell: pwsh
        run: |
          python -m forge3d.determinism `
            --scene terra_determinata_v1 --width 512 --height 512 `
            --out-png anamnesis-portable-producer.png `
            | Tee-Object -FilePath anamnesis-portable-producer.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_anamnesis_portability.py seed `
            --cache anamnesis-portable-store `
            --record anamnesis-portable-record.json `
            --frame-blob anamnesis-portable-producer.png `
            --golden tests/goldens/determinism/terra_determinata_v1.sha256 `
            --adapter-record anamnesis-portable-producer.jsonl `
            --machine-id-file anamnesis-portability-producer-machine-id.txt `
            --runner-name '${{ runner.name }}' `
            --producer-backend vulkan --consumer-backend dx12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: anamnesis-physical-portable-store
          path: |
            anamnesis-portable-store/
            anamnesis-portable-record.json
            anamnesis-portable-producer.jsonl
            anamnesis-portability-producer-adapter.json
            anamnesis-portability-producer-machine-id.txt
          if-no-files-found: error
          retention-days: 90

  test-anamnesis-portability:
    name: ANAMNESIS Physical Consume (Windows DX12)
    needs: [build-wheel-windows, terrain-golden-paths, test-anamnesis-portability-seed]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'anamnesis'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 20
    env:
      FORGE3D_DETERMINISTIC: '1'
      WGPU_BACKEND: dx12
      WGPU_BACKENDS: dx12
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_ANAMNESIS_COMPATIBILITY_PROFILE: terra-determinata-native-portable-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact-head checkout
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "ANAMNESIS checkout mismatch: expected=$expected actual=$actual"
          }
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: anamnesis-physical-portable-store
          path: seeded/
      - name: Install exact-head wheel
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install numpy pillow
      - name: Require physical DX12 consumer
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --json "anamnesis-portability-consumer-adapter.json"
      - name: Record immutable consumer machine identity
        shell: pwsh
        run: |
          $identity = (Get-CimInstance Win32_ComputerSystemProduct).UUID.Trim().ToLowerInvariant()
          if (-not $identity -or $identity -eq '00000000-0000-0000-0000-000000000000') {
            throw "ANAMNESIS consumer machine identity is absent"
          }
          $identity | Set-Content "anamnesis-portability-consumer-machine-id.txt"
      - name: Render fresh consumer and require native graph restoration
        shell: pwsh
        run: |
          python -m forge3d.determinism `
            --scene terra_determinata_v1 --width 512 --height 512 `
            --out-png anamnesis-portable-consumer.png `
            | Tee-Object -FilePath anamnesis-portable-consumer.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_anamnesis_portability.py check `
            --cache seeded/anamnesis-portable-store `
            --record seeded/anamnesis-portable-record.json `
            --consumer-frame-blob anamnesis-portable-consumer.png `
            --consumer-golden tests/goldens/determinism/terra_determinata_v1.dx12.sha256 `
            --consumer-adapter-record anamnesis-portable-consumer.jsonl `
            --machine-id-file anamnesis-portability-consumer-machine-id.txt `
            --runner-name '${{ runner.name }}' `
            --producer-backend vulkan --consumer-backend dx12 `
            | Tee-Object -FilePath anamnesis-portability-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_anamnesis_portability.py mismatch `
            --cache seeded/anamnesis-portable-store `
            --record seeded/anamnesis-portable-record.json `
            --producer-backend vulkan --consumer-backend dx12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anamnesis-portability-evidence
          path: |
            anamnesis-portability-result.json
            anamnesis-portable-consumer.jsonl
            anamnesis-portability-consumer-adapter.json
            anamnesis-portability-consumer-machine-id.txt
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # ANAMNESIS production acceptance
  #
  # Required physical-GPU lane: synthetic digests and software-adapter ABSENT
  # markers cannot satisfy the 600-frame, exact-recompute, or 20x gates.
  # ============================================================================
  test-anamnesis-production:
    name: ANAMNESIS 600-frame Production (NVIDIA Vulkan)
    needs: [build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'anamnesis'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 50
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_RUN_GPU_ANAMNESIS: '1'

    steps:
      - name: Initialize isolated ANAMNESIS scratch
        shell: pwsh
        run: |
          $scratchDrive = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $null -ne $_.Free -and $_.Root } |
            Sort-Object Free -Descending |
            Select-Object -First 1
          if ($null -eq $scratchDrive) { throw 'No filesystem drive is available for ANAMNESIS scratch data' }
          $scratchScope = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $scratchDir = Join-Path $scratchDrive.Root "forge3d-ci-scratch/$scratchScope"
          $baseTemp = Join-Path $scratchDir 'pytest'
          New-Item -ItemType Directory -Force $baseTemp | Out-Null
          "FORGE3D_ANAMNESIS_SCRATCH_DIR=$scratchDir" | Add-Content $env:GITHUB_ENV
          "FORGE3D_ANAMNESIS_BASE_TEMP=$baseTemp" | Add-Content $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact-head checkout
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "ANAMNESIS checkout mismatch: expected=$expected actual=$actual"
          }
          $actual | Set-Content "$env:RUNNER_TEMP/anamnesis-checked-out-head.txt"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install exact-head wheel and tests
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          pip install pytest numpy
      - name: Require physical NVIDIA Vulkan terrain execution
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:RUNNER_TEMP/anamnesis-p0-adapter.json"
      - name: Gate 600/600 bytes, exact recompute set, and 20x speedup
        shell: pwsh
        env:
          FORGE3D_ANAMNESIS_RESULT_PATH: ${{ runner.temp }}/anamnesis-production-result.json
        run: |
          python -m pytest tests/test_anamnesis_incremental.py::test_real_gpu_600_frame_acceptance -v --tb=short --basetemp="$env:FORGE3D_ANAMNESIS_BASE_TEMP"
      - name: Reject native final-frame stale hits
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "anamnesis-p0-native-junit.xml"
          python -m pytest tests/test_anamnesis_inertness.py::test_native_terrain_cache_restores_all_graph_passes -v --tb=short --junitxml="$junit"
          $pytestCode = $LASTEXITCODE
          python scripts/assert_junit_zero_skips.py "$junit"
          $verifyCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          if ($verifyCode -ne 0) { exit $verifyCode }
      - name: Prove per-pass GPU resource restoration
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "anamnesis-p1-gpu-restore-junit.xml"
          python -m pytest tests/test_anamnesis_p1.py::test_public_gpu_graph_cache_restores_intermediate_texture -v --tb=short --junitxml="$junit"
          $pytestCode = $LASTEXITCODE
          python scripts/assert_junit_zero_skips.py "$junit"
          $verifyCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          if ($verifyCode -ne 0) { exit $verifyCode }
      - name: Upload ANAMNESIS production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anamnesis-production-evidence
          path: |
            ${{ runner.temp }}/anamnesis-production-result.json
            ${{ runner.temp }}/anamnesis-p0-native-junit.xml
            ${{ runner.temp }}/anamnesis-p1-gpu-restore-junit.xml
            ${{ runner.temp }}/anamnesis-p0-adapter.json
            ${{ runner.temp }}/anamnesis-checked-out-head.txt
          if-no-files-found: error
          retention-days: 90
      - name: Clean ANAMNESIS scratch
        if: always()
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FORGE3D_ANAMNESIS_SCRATCH_DIR)) {
            Write-Warning 'ANAMNESIS scratch was not initialized; there is no scoped path to clean'
            exit 0
          }
          $scratchDir = [IO.Path]::GetFullPath($env:FORGE3D_ANAMNESIS_SCRATCH_DIR)
          $expectedLeaf = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $parentDir = Split-Path -Parent $scratchDir
          if ((Split-Path -Leaf $scratchDir) -ne $expectedLeaf -or
              (Split-Path -Leaf $parentDir) -ne 'forge3d-ci-scratch') {
            throw "Refusing to clean unexpected ANAMNESIS scratch path: $scratchDir"
          }
          if (Test-Path -LiteralPath $scratchDir) {
            Remove-Item -LiteralPath $scratchDir -Recurse -Force
          }

  # ============================================================================
  # TESSELLA out-of-core terrain acceptance
  #
  # When selected, this lane is mandatory and zero-skip. It proves the six
  # quantitative terrain gates on the exact scheduled/manual candidate SHA with
  # a physical NVIDIA Vulkan adapter.
  # ============================================================================
  test-tessella-gpu:
    name: TESSELLA Out-of-Core Terrain (NVIDIA Vulkan)
    needs: [build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'tessella'))
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 90
    env:
      WGPU_BACKEND: vulkan
      FORGE3D_ALLOW_HOSTED_WINDOWS_TERRAIN: '1'
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_TESSELLA_REQUIRED_GPU: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize exact-head evidence
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "forge3d-tessella-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "FORGE3D_TESSELLA_ARTIFACT_DIR=$artifactDir" | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "TESSELLA checkout mismatch: expected=$expected actual=$actual"
          }
          $actual | Set-Content "$artifactDir/checked-out-head.txt"
          @{
            repository = $env:GITHUB_REPOSITORY
            head_sha = $expected
            checked_out_head = $actual
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            required_backend = 'vulkan'
            required_labels = @('self-hosted', 'Windows', 'X64', 'forge3d-gpu', 'gpu-nvidia')
          } | ConvertTo-Json -Depth 4 | Set-Content "$artifactDir/run-context.json"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install exact-head wheel and test dependencies
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/wheel-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest numpy pillow *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/dependency-install.log"
          exit $LASTEXITCODE
      - name: Require the exact NVIDIA Vulkan adapter
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/adapter-probe.json" *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/adapter-probe.log"
          exit $LASTEXITCODE
      - name: Select stable Rust toolchain for source differentials
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/rust-toolchain.txt"
          exit $LASTEXITCODE
      - name: Require the 1,000-camera GPU CPU LOD differential
        shell: pwsh
        run: |
          cargo test --release --lib `
            terrain::clipmap::gpu_lod::tests::gpu_and_cpu_select_identical_tile_sets_for_1000_cameras `
            -- --ignored --exact --nocapture *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/gpu-cpu-lod-differential.log"
          exit $LASTEXITCODE
      - name: Require the real-shader HZB conservativeness differential
        shell: pwsh
        run: |
          cargo test --release --lib `
            terrain::culling::two_phase::tests::hzb_cull_shader_matches_the_cpu_occlusion_predicate `
            -- --ignored --exact --nocapture *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/hzb-conservativeness-differential.log"
          exit $LASTEXITCODE
      - name: Run all six TESSELLA acceptance gates
        shell: pwsh
        run: |
          $junit = Join-Path $env:FORGE3D_TESSELLA_ARTIFACT_DIR "junit.xml"
          python -m pytest `
            tests/test_vt_out_of_core.py `
            tests/test_hzb_culling.py `
            tests/test_visibility_buffer.py `
            tests/test_bc_encoders.py `
            tests/test_flythrough_popping.py `
            tests/test_vt_request_retention.py `
            tests/test_tessella_certificate_evidence.py `
            -v --tb=short --junitxml="$junit" *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/pytest.log"
          $pytestCode = $LASTEXITCODE
          python scripts/assert_junit_zero_skips.py "$junit" *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/junit-verifier.log"
          $verifyCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          exit $verifyCode
      - name: Consolidate the nine TESSELLA verification results
        shell: pwsh
        run: |
          python scripts/tessella_evidence_report.py "$env:FORGE3D_TESSELLA_ARTIFACT_DIR" `
            *>&1 | Tee-Object "$env:FORGE3D_TESSELLA_ARTIFACT_DIR/verification-report.log"
          exit $LASTEXITCODE
      - name: Upload TESSELLA physical-GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessella-physical-gpu-evidence
          path: ${{ runner.temp }}/forge3d-tessella-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # HELIOS conservative-descent proof
  # ============================================================================
  test-helios-rust-conservative:
    name: HELIOS Conservative Descent (Rust)
    needs: terrain-golden-paths
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'helios' || inputs.scope == 'full')) ||
      (github.event_name == 'schedule' && needs.terrain-golden-paths.outputs.helios == 'true')
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.helios-rust-pass.outputs.gate || 'unknown' }}
    env:
      FORGE3D_HELIOS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind Rust proof to exact candidate
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/forge3d-helios-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifact_dir"
          echo "FORGE3D_HELIOS_RUST_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FORGE3D_HELIOS_CANDIDATE_SHA"
          printf '%s\n' "$actual" > "$artifact_dir/rust-checked-out-head.txt"
      - name: Run the exact conservative-descent proof
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --lib \
            path_tracing::hybrid_compute::terrain_heightfield::tests::curvature_descent_is_conservative \
            -- --exact --nocapture 2>&1 | tee "$FORGE3D_HELIOS_RUST_ARTIFACT_DIR/rust-conservative-descent.log"
      - name: Record conservative-descent PASS
        id: helios-rust-pass
        shell: bash
        run: echo "gate=pass" >> "$GITHUB_OUTPUT"
      - name: Upload HELIOS Rust proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helios-rust-conservative-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge3d-helios-rust-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # HELIOS physical-GPU acceptance
  # ============================================================================
  test-helios-gpu:
    name: HELIOS (NVIDIA DX12 + Vulkan)
    needs: [build-wheel-windows, prepare-lfs-fixtures, terrain-golden-paths, test-helios-rust-conservative]
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'helios' || inputs.scope == 'full')) ||
      (github.event_name == 'schedule' && needs.terrain-golden-paths.outputs.helios == 'true')
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    timeout-minutes: 20
    outputs:
      lane: ${{ steps.helios-pass.outputs.lane || 'unknown' }}
      verifier: ${{ steps.helios-pass.outputs.verifier || 'unknown' }}
    env:
      FORGE3D_NO_BOOTSTRAP: '1'
      FORGE3D_RUN_TERRAIN_GOLDENS: '1'
      FORGE3D_TEST_INSTALLED_WHEEL: '1'
      FORGE3D_HELIOS_REQUIRE_PHYSICAL_GPU: '1'
      FORGE3D_HELIOS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WGPU_BACKEND: vulkan
      WGPU_BACKENDS: vulkan

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Initialize exact-candidate HELIOS evidence
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "forge3d-helios-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "FORGE3D_HELIOS_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:FORGE3D_HELIOS_CANDIDATE_SHA) {
            throw "HELIOS checkout mismatch: expected=$env:FORGE3D_HELIOS_CANDIDATE_SHA actual=$actual"
          }
          $dirty = (git status --porcelain --untracked-files=no | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw "HELIOS tracked worktree is dirty: $dirty" }
          $actual | Set-Content "$artifactDir/checked-out-head.txt"
          @{
            repository = $env:GITHUB_REPOSITORY
            head_sha = $env:FORGE3D_HELIOS_CANDIDATE_SHA
            checked_out_head = $actual
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            required_backend = 'vulkan'
            required_labels = @('self-hosted', 'Windows', 'X64', 'forge3d-gpu', 'gpu-nvidia')
          } | ConvertTo-Json -Depth 4 | Set-Content "$artifactDir/run-context.json"
      - name: Download conservative-descent proof
        uses: actions/download-artifact@v4
        with:
          name: helios-rust-conservative-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge3d-helios-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@v4
        with:
          name: lfs-fixture-bundles
          path: lfs-fixture-bundles
      - name: Restore HELIOS real-DEM fixture
        shell: pwsh
        run: python -m zipfile -e lfs-fixture-bundles/python-tiffs.zip .
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install exact-head wheel and acceptance dependencies
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/wheel-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest numpy rasterio pyproj *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/dependency-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import hashlib, json, pathlib, forge3d._forge3d as native; p=pathlib.Path(native.__file__).resolve(); print(json.dumps({'native_extension': str(p), 'native_sha256': hashlib.sha256(p.read_bytes()).hexdigest()}, indent=2))" | Set-Content "$env:FORGE3D_HELIOS_ARTIFACT_DIR/installed-wheel-runtime.json"
      - name: Require physical NVIDIA Vulkan
        shell: pwsh
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json "$env:FORGE3D_HELIOS_ARTIFACT_DIR/adapter-probe.json" *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/adapter-probe.log"
          exit $LASTEXITCODE
      - name: Dispatch exact production terrain_trace proof on physical GPU
        shell: pwsh
        run: |
          cargo test --release --lib path_tracing::hybrid_compute::terrain_heightfield::tests::curvature_descent_production_gpu_is_conservative -- --exact --nocapture *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/production-gpu-conservative-descent.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all HELIOS wins with zero skips
        shell: pwsh
        run: |
          $junit = Join-Path $env:FORGE3D_HELIOS_ARTIFACT_DIR "pytest-junit.xml"
          python -m pytest tests/test_solar_spa.py tests/test_viewshed_curvature.py tests/test_shadow_tip.py -v --tb=short --capture=tee-sys --junitxml="$junit" *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/pytest.log"
          $pytestCode = $LASTEXITCODE
          python scripts/assert_junit_zero_skips.py "$junit" *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/junit-verifier.log"
          $verifyCode = $LASTEXITCODE
          if ($pytestCode -ne 0) { exit $pytestCode }
          exit $verifyCode
      - name: Verify and consolidate HELIOS evidence
        shell: pwsh
        run: |
          python scripts/helios_evidence_report.py --artifact-dir "$env:FORGE3D_HELIOS_ARTIFACT_DIR" --candidate-sha "$env:FORGE3D_HELIOS_CANDIDATE_SHA" *>&1 | Tee-Object "$env:FORGE3D_HELIOS_ARTIFACT_DIR/evidence-verifier.log"
          exit $LASTEXITCODE
      - name: Record physical lane RAN and verifier PASS
        id: helios-pass
        shell: pwsh
        run: |
          $lane = Get-Content (Join-Path $env:FORGE3D_HELIOS_ARTIFACT_DIR "lane-ran.json") -Raw | ConvertFrom-Json
          $verification = Get-Content (Join-Path $env:FORGE3D_HELIOS_ARTIFACT_DIR "verification.json") -Raw | ConvertFrom-Json
          if ($lane.status -ne "RAN" -or $verification.status -ne "PASS") { throw "HELIOS evidence did not record RAN/PASS" }
          "lane=ran" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verifier=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload SHA-, adapter-, and metric-bound HELIOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helios-physical-gpu-evidence
          path: ${{ runner.temp }}/forge3d-helios-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90

  # ============================================================================
  # Hosted determinism families. These consume the exact platform wheels above
  # and run only for nightly acceptance or an explicit manual scope. ABSENT
  # hosted GPU evidence never substitutes for the physical NVIDIA acceptance
  # jobs.
  # ============================================================================
  determinism-render:
    name: Hosted Render Determinism
    needs: [build-wheel-linux, build-wheel-windows, build-wheel-macos, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism'))
    uses: ./.github/workflows/determinism-matrix.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_render: true

  determinism-f3dz:
    name: Hosted F3DZ Determinism
    needs: [build-wheel-linux, build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism' || inputs.scope == 'f3dz'))
    uses: ./.github/workflows/determinism-matrix.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_f3dz: true

  determinism-anamnesis:
    name: Hosted ANAMNESIS Determinism
    needs: [build-wheel-linux, build-wheel-windows, terrain-golden-paths]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism' || inputs.scope == 'anamnesis'))
    uses: ./.github/workflows/determinism-matrix.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_anamnesis: true

  # ============================================================================
  # Documentation Build
  # ============================================================================
  build-docs:
    name: Build Documentation
    needs: preflight
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust docs
        run: cargo doc --workspace --features default,async_readback,copc_laz,cog_streaming,gis-remote,geos-topology,weighted-oit,wsI_bigbuf,wsI_double_buf,enable-pbr,enable-tbn,enable-normal-mapping,enable-hdr-offscreen,enable-renderer-config,enable-staging-rings,shader-contract-asserts --no-deps

  # ============================================================================
  # Stable hosted gate for every existing and future PR. Configure branch
  # protection to require only this context; physical evidence remains separate.
  # ============================================================================
  pr-core-success:
    name: PR Core Success
    needs: [preflight, test-fast-contract]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Enforce the hosted core contract
        shell: bash
        run: |
          test '${{ needs.preflight.result }}' = success
          test '${{ needs.test-fast-contract.result }}' = success

  # This aggregate is intentionally separate from PR Core Success. It validates
  # selected high-cost hosted and physical claims without delaying every merge.
  full-acceptance-summary:
    name: Full Acceptance Summary
    needs: [pr-core-success, terrain-golden-paths, test-rust, test-python-full-linux, test-python-full-windows, test-python-full-macos, test-python-slow, test-terminus-fuzz, test-python-linux-arm, test-golden-images-nvidia, test-substratia-gpu-nvidia, build-docs, determinism-render, determinism-f3dz, determinism-anamnesis, test-m06-full-geospatial-viewer, test-f3dz-gpu, test-anamnesis-portability-seed, test-anamnesis-portability, test-anamnesis-production, test-tessella-gpu, test-helios-rust-conservative, test-helios-gpu]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.scope != 'core'))
    steps:
      - name: Enforce every selected acceptance family
        shell: bash
        run: |
          failed=0
          check_selected() {
            selected="$1"
            result="$2"
            label="$3"
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$label was selected but finished as $result"
              failed=1
            elif [ "$selected" != "true" ] && [ "$result" != "skipped" ]; then
              echo "::error::$label was not selected but finished as $result"
              failed=1
            fi
          }
          if [ '${{ needs.pr-core-success.result }}' != 'success' ]; then
            echo "::error::PR Core Success finished as ${{ needs.pr-core-success.result }}"
            failed=1
          fi
          full_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}"
          m06_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'm06')) }}"
          f3dz_physical_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'f3dz')) }}"
          anamnesis_physical_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'anamnesis')) }}"
          tessella_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'tessella')) }}"
          helios_selected="${{ (github.event_name == 'schedule' && needs.terrain-golden-paths.outputs.helios == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'helios')) }}"
          render_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism')) }}"
          f3dz_hosted_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism' || inputs.scope == 'f3dz')) }}"
          anamnesis_hosted_selected="${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'determinism' || inputs.scope == 'anamnesis')) }}"

          check_selected "$full_selected" '${{ needs.test-rust.result }}' rust-full
          check_selected "$full_selected" '${{ needs.test-python-full-linux.result }}' python-full-linux
          check_selected "$full_selected" '${{ needs.test-python-full-windows.result }}' python-full-windows
          check_selected "$full_selected" '${{ needs.test-python-full-macos.result }}' python-full-macos
          check_selected "$full_selected" '${{ needs.test-python-slow.result }}' python-slow
          check_selected "$full_selected" '${{ needs.test-terminus-fuzz.result }}' terminus-fuzz
          check_selected "$full_selected" '${{ needs.test-python-linux-arm.result }}' python-linux-arm
          check_selected "$full_selected" '${{ needs.test-golden-images-nvidia.result }}' visual-goldens-nvidia
          check_selected "$full_selected" '${{ needs.test-substratia-gpu-nvidia.result }}' substratia-physical-nvidia
          if [ "$full_selected" = "true" ]; then
            if [ '${{ needs.test-golden-images-nvidia.outputs.lane }}' != 'ran' ]; then
              echo "::error::visual NVIDIA Vulkan lane did not record RAN"
              failed=1
            fi
            if [ '${{ needs.test-substratia-gpu-nvidia.outputs.lane }}' != 'ran' ]; then
              echo "::error::SUBSTRATIA physical lane did not record RAN"
              failed=1
            fi
            if [ '${{ needs.test-substratia-gpu-nvidia.outputs.verifier }}' != 'pass' ]; then
              echo "::error::SUBSTRATIA evidence verifier did not record PASS"
              failed=1
            fi
          fi
          check_selected "$full_selected" '${{ needs.build-docs.result }}' docs
          if [ "$full_selected" = "true" ]; then
            sidera_lane='${{ needs.test-golden-images-nvidia.outputs.sidera_lane }}'
            echo "SIDERA physical NVIDIA Vulkan lane: $sidera_lane"
            if [ "$sidera_lane" != "ran" ]; then
              echo "::error::SIDERA physical NVIDIA Vulkan lane was selected but reported $sidera_lane"
              failed=1
            fi
          fi

          check_selected "$render_selected" '${{ needs.determinism-render.result }}' determinism-render
          check_selected "$f3dz_hosted_selected" '${{ needs.determinism-f3dz.result }}' determinism-f3dz
          check_selected "$anamnesis_hosted_selected" '${{ needs.determinism-anamnesis.result }}' determinism-anamnesis
          check_selected "$m06_selected" '${{ needs.test-m06-full-geospatial-viewer.result }}' m06-physical
          check_selected "$f3dz_physical_selected" '${{ needs.test-f3dz-gpu.result }}' f3dz-physical
          check_selected "$anamnesis_physical_selected" '${{ needs.test-anamnesis-portability-seed.result }}' anamnesis-seed
          check_selected "$anamnesis_physical_selected" '${{ needs.test-anamnesis-portability.result }}' anamnesis-portability
          check_selected "$anamnesis_physical_selected" '${{ needs.test-anamnesis-production.result }}' anamnesis-production
          check_selected "$tessella_selected" '${{ needs.test-tessella-gpu.result }}' tessella-physical
          check_selected "$helios_selected" '${{ needs.test-helios-rust-conservative.result }}' helios-rust-conservative
          check_selected "$helios_selected" '${{ needs.test-helios-gpu.result }}' helios-physical
          if [ "$helios_selected" = "true" ]; then
            if [ '${{ needs.test-helios-rust-conservative.outputs.gate }}' != 'pass' ]; then
              echo "::error::HELIOS conservative-descent proof did not record PASS"
              failed=1
            fi
            if [ '${{ needs.test-helios-gpu.outputs.lane }}' != 'ran' ]; then
              echo "::error::HELIOS physical lane did not record RAN"
              failed=1
            fi
            if [ '${{ needs.test-helios-gpu.outputs.verifier }}' != 'pass' ]; then
              echo "::error::HELIOS evidence verifier did not record PASS"
              failed=1
            fi
          fi
          exit "$failed"
