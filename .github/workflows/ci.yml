name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Select the expensive acceptance scope; core is hosted CI only.
        required: true
        default: core
        type: choice
        options:
          - core
          - full
          - determinism
          - m06
          - f3dz
          - anamnesis
          - tessella
          - helios

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref_name) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap repository-native workflow contracts run before any Rust matrix,
  # wheel build, LFS download, or physical-runner allocation.
  preflight:
    name: CI Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pull-request activity payloads can retain an old base SHA and expose the
      # legacy PR head as github.sha. Start from the live base branch instead,
      # then integrate the immutable PR head locally. Every source/artifact job
      # below remains exact-head.
      - name: Checkout live policy base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.sha }}
          fetch-depth: 0

      # workflow_dispatch normally resolves github.sha to the selected
      # candidate branch. Move policy evaluation back to the protected default
      # branch before recording the trusted SHA; the candidate is merged below.
      - name: Resolve protected policy base for manual acceptance
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          POLICY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${POLICY_BRANCH}:refs/remotes/origin/${POLICY_BRANCH}"
          git checkout --detach "refs/remotes/origin/${POLICY_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/${POLICY_BRANCH})"

      - name: Snapshot live policy base
        id: policy-base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Execute the validator from a second base-owned checkout so a candidate
      # cannot weaken the tests or helper modules that judge its merged tree.
      - name: Checkout trusted CI contracts
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.policy-base.outputs.sha }}
          path: .ci-contracts

      - name: Materialize current-base candidate tree
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          POLICY_BASE_SHA: ${{ steps.policy-base.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$POLICY_BASE_SHA"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          test "$(git rev-parse refs/remotes/pull/${PR_NUMBER}/head)" = "$PR_HEAD_SHA"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$POLICY_BASE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$PR_HEAD_SHA"
          printf 'policy_base_sha=%s\ncandidate_head_sha=%s\n' \
            "$POLICY_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize manual-dispatch candidate tree
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          POLICY_BASE_SHA: ${{ steps.policy-base.outputs.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$POLICY_BASE_SHA"
          git fetch --no-tags origin "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_HEAD_SHA"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$CANDIDATE_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$POLICY_BASE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$CANDIDATE_HEAD_SHA"
          printf 'policy_base_sha=%s\ncandidate_head_sha=%s\n' \
            "$POLICY_BASE_SHA" "$CANDIDATE_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate workflow and cost-control contracts
        working-directory: .ci-contracts
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
          FORGE3D_CI_CONTRACT_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}/.ci-contracts
        run: |
          python -m pip install pytest pyyaml
          python -m pytest \
            tests/test_assert_junit_zero_skips.py \
            tests/test_ci_cost_controls.py \
            tests/test_ci_lfs_fanout.py \
            tests/test_determinism_matrix.py \
            -k "not determinism_record_persists_strict_adapter_identity" \
            -q

  # Stable routine branch-protection lane. Expensive platform, rendering,
  # signing, and physical evidence remain in the acceptance scopes below.
  test-fast-contract:
    name: Fast Contract
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install focused build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev pkg-config
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -U pip maturin pytest numpy pillow
      - name: Check formatting and routine Rust contracts
        run: |
          cargo fmt --check
          cargo forge3d-clippy
      - name: Build the development extension once
        run: maturin develop
      - name: Run focused CENSOR truth contracts
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: python scripts/ci_pytest_lane.py --profile fast -v --tb=short

  # ============================================================================
  # Shared Git LFS fixtures
  #
  # Hosted matrix jobs start on fresh machines. Fetching LFS in every checkout
  # multiplied the same download across all 12 Python jobs plus visual/M-06
  # lanes. Resolve the exact union once, package lane-specific subsets, and let
  # consumers restore those subsets from one short-lived Actions artifact.
  # ============================================================================
  prepare-lfs-fixtures:
    name: Prepare LFS Fixtures
    needs: preflight
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.scope == 'core' || inputs.scope == 'full' || inputs.scope == 'm06' ||
        inputs.scope == 'helios'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download the required LFS objects once
        shell: bash
        run: |
          media_base="https://media.githubusercontent.com/media/milos-agathon/forge3d/92a86baa3c8f6ba3c3a7368e4f80d4004905a433"
          selene_media_base="https://media.githubusercontent.com/media/milos-agathon/forge3d/19028116dfbe9b954eac63e0a211be0d544226aa"
          while read -r sha256 fixture; do
            fixture_base="$media_base"
            if [ "$fixture" = "assets/tif/moon_south_pole_lola.tif" ]; then
              fixture_base="$selene_media_base"
            fi
            curl --fail --location --retry 3 \
              --output "$fixture" "$fixture_base/$fixture"
            echo "$sha256  $fixture" | sha256sum --check -
          done <<'EOF'
          cff39b4e02d7ba13c48f3d8b1a4080d40ada753ade62fa951459fe4e01e98b48 assets/tif/Mount_Fuji_30m.tif
          875b243474b151175f76037acd60c2149ac2e46fba9ba2bbce0c9a6998015dd3 assets/tif/dem_rainier.tif
          d09d229fa265749720a6b4bd40c440799f43286bf2d401d732ea77f89d0bd478 assets/tif/switzerland_dem.tif
          575e4b57d69d5db1bc16d5cd7edc8c83c570e280717e9e7ca225c060fd0aeb3d assets/tif/moon_south_pole_lola.tif
          EOF

          for fixture in \
            assets/tif/Mount_Fuji_30m.tif \
            assets/tif/dem_rainier.tif \
            assets/tif/switzerland_dem.tif \
            assets/tif/moon_south_pole_lola.tif; do
            if [ "$(wc -c < "$fixture")" -le 1024 ]; then
              echo "::error::$fixture is still an LFS pointer"
              exit 1
            fi
          done

      - name: Package lane-specific fixture subsets
        shell: bash
        run: |
          mkdir -p lfs-fixture-bundles
          zip -q lfs-fixture-bundles/python-tiffs.zip \
            assets/tif/Mount_Fuji_30m.tif \
            assets/tif/dem_rainier.tif \
            assets/tif/switzerland_dem.tif \
            assets/tif/moon_south_pole_lola.tif
          zip -q lfs-fixture-bundles/m06-dem.zip \
            assets/tif/switzerland_dem.tif

      - name: Upload shared LFS fixture bundles
        uses: actions/upload-artifact@v4
        with:
          name: lfs-fixture-bundles
          path: lfs-fixture-bundles/*.zip
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Visual Golden Change Detection
  # ============================================================================
  terrain-golden-paths:
    name: Visual Golden Paths
    needs: preflight
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      terrain_goldens: ${{ steps.filter.outputs.terrain_goldens }}
      m06: ${{ steps.filter.outputs.m06 }}
      f3dz: ${{ steps.filter.outputs.f3dz }}
      helios: ${{ steps.filter.outputs.helios }}
      anamnesis: ${{ steps.filter.outputs.anamnesis }}
      determinism_render: ${{ steps.filter.outputs.determinism_render }}
      determinism_f3dz: ${{ steps.filter.outputs.determinism_f3dz }}
      determinism_anamnesis: ${{ steps.filter.outputs.determinism_anamnesis }}
      tessella: ${{ steps.filter.outputs.tessella }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect visual golden changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terrain_goldens:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'python/**'
              - 'src/shaders/**/*.wgsl'
              - 'src/terrain/**'
              - 'src/viewer/terrain/**'
              - 'python/forge3d/terrain*.py'
              - 'examples/terrain*.py'
              - 'tests/test_terrain_visual_goldens.py'
