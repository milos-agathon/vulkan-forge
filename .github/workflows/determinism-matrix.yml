# TERRA-DETERMINATA: cross-vendor bit-exact rendering gate.
#
# Renders the canonical terrain+CSM+IBL reference scene (forge3d.determinism)
# on an {intel, amd, nvidia, wasm} matrix. Physical NVIDIA/Vulkan is the
# required hardware anchor; every additional produced SHA-256 must equal it and
# the committed tests/goldens/determinism/terra_determinata_v1.sha256. Zero-byte
# tolerance.
#
# Gated vs informational legs (follows the repo convention of skipping visual
# goldens on unsupported hosted GPUs, see ci.yml test-golden-images):
#   - intel  : informational on hosted ubuntu (no Intel GPU; llvmpipe/lavapipe
#              are software adapters). Becomes gated on a self-hosted
#              gpu-intel runner.
#   - amd    : informational on hosted windows (no AMD GPU; WARP is software).
#              Becomes gated on a self-hosted gpu-amd runner.
#   - nvidia : GATED on the self-hosted Windows gpu-nvidia runner. Absence,
#              software fallback, render failure, or hash drift is fatal.
#   - wasm   : the relaxed-SIMD build-policy check is GATED (RUSTFLAGS /
#              .cargo config must never enable +relaxed-simd — it is
#              nondeterministic by design). The render itself is informational
#              until a browser-backed WebGPU runner exists.
#
# Informational legs still attempt a real render: if a hardware adapter is
# present they upload a hash that the diff job enforces; if not they upload an
# explicit ABSENT marker with the reason (loud, never a silent placeholder).

name: Determinism acceptance

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA whose already-built wheels are under test.
        required: true
        type: string
      run_render:
        required: false
        default: false
        type: boolean
      run_f3dz:
        required: false
        default: false
        type: boolean
      run_anamnesis:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SCENE: terra_determinata_v1
  FORGE3D_NO_BOOTSTRAP: '1'

jobs:
  f3dz-stream:
    name: f3dz stream (${{ matrix.os }})
    if: inputs.run_f3dz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          path: dist/
      - name: Install the exact wheel built by the caller
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install numpy pytest
      - name: Reproduce each stream twice against the committed hashes
        shell: bash
        run: |
          mkdir -p f3dz-determinism
          python tools/f3dz_determinism_report.py \
            --output "f3dz-determinism/${{ matrix.os }}.json"
          python -m pytest \
            tests/test_f3dz_codec.py::test_error_bound_stored_page_error_nan_and_determinism \
            tests/test_f3dz_codec.py::test_cross_platform_determinism_hashes \
            -v --tb=short
      - uses: actions/upload-artifact@v4
        with:
          name: f3dz-determinism-${{ matrix.os }}
          path: f3dz-determinism/
          if-no-files-found: error
          retention-days: 7

  render:
    name: render (${{ matrix.leg }})
    if: inputs.run_render
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: intel
            os: ubuntu-latest
            backend: vulkan
            gated: false
          - leg: amd
            os: windows-latest
            backend: dx12
            gated: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mesa Vulkan drivers (Linux legs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
          path: dist/
      - name: Install the exact wheel built by the caller
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install numpy
      - name: Render canonical scene
        shell: bash
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKENDS: ${{ matrix.backend }}
        run: |
          mkdir -p hash-out
          # pipefail: without it $? is tee's exit code and a failed render
          # (e.g. the deterministic-mode software-adapter refusal) would be
          # misread as success instead of taking the ABSENT path below.
          set +e
          set -o pipefail
          python -m forge3d.determinism \
            --scene "$SCENE" --width 512 --height 512 \
            --out-png "hash-out/${SCENE}.png" 2>render.err | tee render.log
          status=$?
          set -e
          set +o pipefail
          cat render.err
          if [ $status -eq 0 ]; then
            python - <<'EOF'
          import json, pathlib
          last = pathlib.Path('render.log').read_text().strip().splitlines()[-1]
          rec = json.loads(last)
          sha = rec['sha256']
          pathlib.Path('hash-out/${{ env.SCENE }}.sha256').write_text(sha + '\n')
          # Persist the full JSON record (incl. adapter identity) next to the
          # hash so the artifact is attributable to real hardware.
          pathlib.Path('hash-out/${{ env.SCENE }}.json').write_text(json.dumps(rec) + '\n')
          print('hash:', sha)
          print('adapter:', json.dumps(rec.get('adapter')))
          EOF
          elif [ "${{ matrix.gated }}" = "true" ]; then
            echo "GATED leg '${{ matrix.leg }}' failed to render — failing the build."
            # Leave an auditable marker (uploaded via if: always()) so the diff
            # job can print WHY the gated leg has no hash.
            {
              echo "gated leg '${{ matrix.leg }}' failed to render (exit $status)"
              tail -n 20 render.log || true
              tail -n 20 render.err || true
            } > "hash-out/${SCENE}.FAILED"
            exit $status
          else
            echo "informational leg '${{ matrix.leg }}': no usable hardware adapter on this hosted runner" \
              | tee "hash-out/${SCENE}.ABSENT"
            tail -n 20 render.log >> "hash-out/${SCENE}.ABSENT" || true
            tail -n 20 render.err >> "hash-out/${SCENE}.ABSENT" || true
          fi
      - name: Prove DUPLA precision
        shell: bash
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKENDS: ${{ matrix.backend }}
        run: |
          python scripts/run_dupla_proof.py \
            --output "hash-out/dupla-proof-${{ matrix.leg }}.json" \
            --absence-output "hash-out/dupla-proof-${{ matrix.leg }}.ABSENT" \
            --failure-output "hash-out/dupla-proof-${{ matrix.leg }}.FAILED"
      - uses: actions/upload-artifact@v4
        # always(): a gated leg that fails still uploads its .FAILED marker so
        # the diff job can report the reason instead of a silent hole.
        if: always()
        with:
          name: determinism-hash-${{ matrix.leg }}
          path: hash-out/
          if-no-files-found: error
          retention-days: 7

  render-nvidia:
    name: render (nvidia)
    if: inputs.run_render
    runs-on: [self-hosted, Windows, X64, forge3d-gpu, gpu-nvidia]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install the exact Windows wheel built by the caller
        shell: pwsh
        run: |
          python scripts/install_compatible_wheel.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy
          exit $LASTEXITCODE
      - name: Initialize NVIDIA determinism evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path hash-out | Out-Null
      - name: Require physical NVIDIA Vulkan adapter
        shell: pwsh
        env:
          WGPU_BACKEND: vulkan
        run: |
          python scripts/terrain_ci_probe.py --mode terrain --require-nvidia-vulkan --json hash-out/nvidia-adapter-probe.json
          exit $LASTEXITCODE
      - name: Render and bind two canonical NVIDIA frames
        shell: pwsh
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKENDS: vulkan
        run: |
          python scripts/run_nvidia_determinism_acceptance.py --artifact-dir hash-out --adapter-probe hash-out/nvidia-adapter-probe.json --scene "$env:SCENE" --width 512 --height 512
          exit $LASTEXITCODE
      - name: Prove NVIDIA DUPLA precision
        shell: pwsh
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKENDS: vulkan
        run: |
          python scripts/run_dupla_proof.py --output hash-out/dupla-proof-nvidia.json --absence-output hash-out/dupla-proof-nvidia.ABSENT --failure-output hash-out/dupla-proof-nvidia.FAILED
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: determinism-hash-nvidia
          path: hash-out/
          if-no-files-found: error
          retention-days: 7

  # Optional Apple/Metal diagnostic retained for backend support. It is
  # disabled by default, publishes a separately named artifact, and is not a
  # dependency of the determinism acceptance summary.
  metal-diagnostic:
    name: optional render diagnostic (apple/metal)
    continue-on-error: true
    if: inputs.run_render && vars.FORGE3D_RUN_METAL_DIAGNOSTIC == '1'
    strategy:
      matrix:
        include:
          - leg: apple
            os: macos-14
            backend: metal
            gated: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: dist/
      - name: Install exact macOS wheel for optional diagnostic
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install numpy
      - name: Render optional Apple/Metal diagnostic
        shell: bash
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKENDS: metal
        run: |
          mkdir -p metal-diagnostic-out
          cd metal-diagnostic-out
          set +e
          python -m forge3d.determinism \
            --scene "$SCENE" --width 512 --height 512 \
            --out-png "${SCENE}.png" 2>render.err | tee render.log
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "optional Apple/Metal diagnostic rendered; no acceptance comparison is applied"
          elif [ "${{ matrix.gated }}" = "true" ]; then
            if [ "${{ matrix.leg }}" = "apple" ] && grep -q "hypervisor-virtualized GPU" render.err; then
              echo "documented Apple Paravirtual adapter absence" > ${SCENE}.ABSENT
              exit 0
            fi
            exit $status
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: determinism-metal-diagnostic-apple
          path: metal-diagnostic-out/
          if-no-files-found: error
          retention-days: 7

  wasm-policy:
    name: render (wasm) — relaxed-SIMD policy gate
    if: inputs.run_render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Forbid relaxed-SIMD in any build configuration (GATED)
        run: |
          # Relaxed SIMD is nondeterministic by design (results may vary per
          # engine/hardware). The wasm build path must never enable it:
          # RUSTFLAGS / target-features must NOT include +relaxed-simd.
          if grep -rn "relaxed-simd" .cargo/ Cargo.toml pyproject.toml .github/workflows/ --include='*' 2>/dev/null | grep -v "determinism-matrix.yml"; then
            echo "relaxed-simd found in build configuration — nondeterministic, forbidden."
            exit 1
          fi
          echo "OK: no build path enables +relaxed-simd."
      - name: Document informational render status
        run: |
          mkdir -p hash-out
          echo "informational leg 'wasm': hosted runners have no browser WebGPU device;" \
               "render leg activates when a browser-backed runner (e.g. wgpu-in-chrome) is available." \
               > "hash-out/${SCENE}.ABSENT"
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-hash-wasm
          path: hash-out/
          if-no-files-found: error
          retention-days: 7

  anamnesis-seed:
    name: anamnesis golden-store seed (linux/vulkan)
    if: inputs.run_anamnesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Prove exact-head checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mesa Vulkan drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux
          path: dist/
      - name: Install the exact wheel built by the caller
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install numpy pytest pillow
      - name: Classify the hosted Vulkan adapter before runtime tests
        id: anamnesis-probe
        shell: bash
        run: |
          set +e
          python scripts/terrain_ci_probe.py \
            --mode terrain --json anamnesis-seed-adapter.json
          probe_status=$?
          set -e
          if [ "$probe_status" -eq 0 ]; then
            echo "status=positive" >> "$GITHUB_OUTPUT"
          elif [ "$probe_status" -eq 2 ]; then
            echo "status=absent" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANAMNESIS hosted probe crashed on a CI-safe adapter (exit $probe_status)"
            exit "$probe_status"
          fi
      - name: Gate ANAMNESIS incrementality, speed, hermeticity, and corruption handling
        run: |
          python -m pytest \
            tests/test_anamnesis_incremental.py \
            tests/test_anamnesis_adversarial_keys.py \
            tests/test_anamnesis_inertness.py \
            tests/test_anamnesis_hermeticity.py \
            tests/test_anamnesis_portability.py \
            tests/test_anamnesis_uniform_layout.py \
            -v --tb=short
      - name: Render golden and populate portable store
        shell: bash
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKEND: vulkan
          WGPU_BACKENDS: vulkan
        run: |
          if [ "${{ steps.anamnesis-probe.outputs.status }}" = "absent" ]; then
            echo "ABSENT: terrain_ci_probe proved no physical Linux/Vulkan adapter" \
              > ANAMNESIS.ABSENT
          else
            set -o pipefail
            python -m forge3d.determinism \
              --scene terra_determinata_v1 --width 512 --height 512 \
              --out-png anamnesis-golden.png \
              | tee anamnesis-render.jsonl
            set +o pipefail
            FORGE3D_RUN_GPU_ANAMNESIS=1 \
            FORGE3D_ANAMNESIS_RESULT_PATH=anamnesis-gpu-result.json \
              python -m pytest \
                tests/test_anamnesis_incremental.py::test_real_gpu_600_frame_acceptance \
                -v --tb=short
            python scripts/check_anamnesis_portability.py seed \
              --cache anamnesis-store --record anamnesis-record.json \
              --frame-blob anamnesis-golden.png \
              --golden tests/goldens/determinism/terra_determinata_v1.sha256 \
              --adapter-record anamnesis-render.jsonl
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anamnesis-store-linux
          path: |
            anamnesis-store/
            anamnesis-record.json
            anamnesis-gpu-result.json
            anamnesis-seed-adapter.json
            ANAMNESIS.ABSENT
          if-no-files-found: error
          retention-days: 7

  anamnesis-portability:
    name: anamnesis portability consume (windows)
    needs: anamnesis-seed
    if: inputs.run_anamnesis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Prove exact-head checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: anamnesis-store-linux
          path: seeded
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows
          path: dist/
      - name: Install the exact wheel built by the caller
        run: |
          python scripts/install_compatible_wheel.py dist
          python -m pip install numpy
      - name: Require portable hits and mismatch isolation
        shell: bash
        env:
          FORGE3D_DETERMINISTIC: '1'
          WGPU_BACKEND: dx12
          WGPU_BACKENDS: dx12
        run: |
          if [ -f seeded/ANAMNESIS.ABSENT ]; then
            echo "ABSENT: Linux/Vulkan seed host exposed no physical adapter"
          else
            set +e
            python scripts/terrain_ci_probe.py \
              --mode terrain --json anamnesis-consumer-adapter.json
            probe_status=$?
            set -e
            if [ "$probe_status" -eq 2 ]; then
              echo "ABSENT: terrain_ci_probe proved no physical Windows/DX12 adapter" \
                > ANAMNESIS.CONSUMER.ABSENT
              exit 0
            elif [ "$probe_status" -ne 0 ]; then
              echo "ANAMNESIS consumer probe crashed on a CI-safe adapter"
              exit "$probe_status"
            fi
            set -o pipefail
            python -m forge3d.determinism \
              --scene terra_determinata_v1 --width 512 --height 512 \
              --out-png anamnesis-consumer.png \
              | tee anamnesis-consumer.jsonl
            set +o pipefail
            python scripts/check_anamnesis_portability.py check \
              --cache seeded/anamnesis-store --record seeded/anamnesis-record.json \
              --consumer-frame-blob anamnesis-consumer.png \
              --consumer-adapter-record anamnesis-consumer.jsonl
            python scripts/check_anamnesis_portability.py mismatch \
              --cache seeded/anamnesis-store --record seeded/anamnesis-record.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anamnesis-hosted-consumer-evidence
          path: |
            anamnesis-consumer-adapter.json
            anamnesis-consumer.jsonl
            ANAMNESIS.CONSUMER.ABSENT
          if-no-files-found: warn
          retention-days: 7

  diff:
    name: Determinism Acceptance Summary
    needs: [f3dz-stream, render, render-nvidia, wasm-policy, anamnesis-seed, anamnesis-portability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        if: inputs.run_render
        with:
          pattern: determinism-hash-*
          path: hashes
      - name: Fail on any pairwise or golden mismatch
        if: inputs.run_render
        run: >-
          python scripts/check_determinism_hashes.py
          --hashes hashes
          --golden tests/goldens/determinism/${{ env.SCENE }}.sha256
          --scene ${{ env.SCENE }}
      - name: Validate DUPLA backend proofs
        if: inputs.run_render
        run: >-
          python scripts/run_dupla_proof.py
          --validate-artifacts hashes
          --expected-legs intel amd nvidia
      - name: Enforce every requested family
        shell: bash
        run: |
          failed=0
          check_family() {
            requested="$1"
            result="$2"
            label="$3"
            if [ "$requested" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$label was requested but finished as $result"
              failed=1
            elif [ "$requested" != "true" ] && [ "$result" != "skipped" ]; then
              echo "::error::$label was not requested but finished as $result"
              failed=1
            fi
          }
          check_family '${{ inputs.run_f3dz }}' '${{ needs.f3dz-stream.result }}' f3dz
          check_family '${{ inputs.run_render }}' '${{ needs.render.result }}' render
          check_family '${{ inputs.run_render }}' '${{ needs.render-nvidia.result }}' render-nvidia
          check_family '${{ inputs.run_render }}' '${{ needs.wasm-policy.result }}' wasm-policy
          check_family '${{ inputs.run_anamnesis }}' '${{ needs.anamnesis-seed.result }}' anamnesis-seed
          check_family '${{ inputs.run_anamnesis }}' '${{ needs.anamnesis-portability.result }}' anamnesis-portability
          exit "$failed"
