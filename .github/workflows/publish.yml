name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build artifacts only, do not publish)
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-wheels:
    name: Build Wheel (${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: --release --out dist
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: --release --out dist -i python3.10
          - os: linux-arm
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            maturin_args: --release --out dist -i python3.10
          - os: macos
            runner: macos-latest
            target: universal2-apple-darwin
            maturin_args: --release --out dist

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # ring's aarch64 assembly expects this macro under the manylinux cross compiler.
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.platform.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin_args }}
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}
          path: dist/*.whl
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 1 }}

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install maturin
        run: python -m pip install --upgrade maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 1 }}

  smoke-test:
    name: Smoke Test (${{ matrix.platform.os }})
    needs: [build-wheels]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows
            runner: windows-latest
            artifact: wheels-windows
          - os: linux
            runner: ubuntu-latest
            artifact: wheels-linux
          - os: linux-arm
            runner: ubuntu-latest
            artifact: wheels-linux-arm
          - os: macos
            runner: macos-latest
            artifact: wheels-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.platform.os != 'linux-arm'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist/

      - name: Install wheel and run smoke tests
        if: matrix.platform.os != 'linux-arm'
        env:
          FORGE3D_NO_BOOTSTRAP: '1'
        run: |
          python -m pip install --upgrade pip pytest numpy
          python scripts/install_compatible_wheel.py dist
          pytest tests/test_install_smoke.py -v --tb=short

      - name: Set up QEMU
        if: matrix.platform.os == 'linux-arm'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run smoke test in arm64 container
        if: matrix.platform.os == 'linux-arm'
        shell: bash
        run: |
          docker run --rm --platform linux/arm64/v8 \
            -v "${PWD}:/workspace" \
            -w /workspace \
            python:3.11-slim \
            bash -lc "python -m pip install -U pip pytest numpy && python /workspace/scripts/install_compatible_wheel.py /workspace/dist && FORGE3D_NO_BOOTSTRAP=1 pytest tests/test_install_smoke.py -v --tb=short"

  release-assets:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tag matches pyproject version
        run: |
          python -c "import tomllib; from pathlib import Path; version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; tag = '${{ github.ref_name }}'.lstrip('v'); assert version == tag, f'{version}!={tag}'"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Create GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'))
    needs: [build-wheels, build-sdist, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/forge3d/
    env:
      HAS_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "import tomllib; from pathlib import Path; version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; tag = '${{ github.ref_name }}'.lstrip('v'); assert version == tag, f'{version}!={tag}'"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Select publish auth mode
        run: |
          if [ "${HAS_PYPI_API_TOKEN}" = "true" ]; then
            echo "Using PYPI_API_TOKEN for publish."
          else
            echo "No PYPI_API_TOKEN configured; falling back to PyPI trusted publishing."
          fi

      - name: Publish to PyPI with API token
        if: env.HAS_PYPI_API_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI with trusted publishing
        if: env.HAS_PYPI_API_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
